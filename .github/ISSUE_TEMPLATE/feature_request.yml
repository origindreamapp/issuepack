name: Feature request
description: Propose a focused improvement to IssuePack.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private logs, credentials, customer names, or other personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What diagnostic-sharing problem should IssuePack solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior, including expected CLI or API output.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can users do today, and why is it insufficient?
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This proposal preserves read-only input handling and local-only processing.
          required: true
